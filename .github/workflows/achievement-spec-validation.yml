name: Lance spec-only PR pre-commit

on:
  push:
    branches: [validation/fts-spec-9670]

permissions:
  contents: read

jobs:
  spec-precommit:
    name: Pinned pre-commit on the spec and proto files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the requested candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: 98244d2b86c6ebc67d7ef15ae8d399187dff5981
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify exact commit and clean checkout
        env:
          EXPECTED_SHA: 98244d2b86c6ebc67d7ef15ae8d399187dff5981
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/lance-spec-validation"
          {
            printf 'commit=%s\n' "$actual_sha"
            python3 --version
          } > "$RUNNER_TEMP/lance-spec-validation/environment.txt"
          sha256sum docs/src/format/table/versioning.md protos/table.proto \
            > "$RUNNER_TEMP/lance-spec-validation/changed-files-before.sha256"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check 'pre-commit==4.2.0'

      - name: Run all applicable pinned hooks on the two changed files
        run: |
          set -euo pipefail
          pre-commit run --files docs/src/format/table/versioning.md protos/table.proto \
            2>&1 | tee "$RUNNER_TEMP/lance-spec-validation/pre-commit.log"

      - name: Verify hooks left the candidate unchanged
        if: always()
        run: |
          set -euo pipefail
          sha256sum docs/src/format/table/versioning.md protos/table.proto \
            > "$RUNNER_TEMP/lance-spec-validation/changed-files-after.sha256"
          diff -u "$RUNNER_TEMP/lance-spec-validation/changed-files-before.sha256" \
            "$RUNNER_TEMP/lance-spec-validation/changed-files-after.sha256"
          git diff --exit-code -- docs/src/format/table/versioning.md protos/table.proto
          test -z "$(git status --porcelain)"

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lance-spec-precommit-${{ github.run_id }}
          path: ${{ runner.temp }}/lance-spec-validation/
          retention-days: 14
